name: CI
run-name: CI for commit ${{ github.sha }}
on:
  pull_request:
    branches: [main, develop]
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
          cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Pull environment variables
        run: bunx vercel env pull --yes --token=${{ secrets.VERCEL_TOKEN }}
      - name: Lint code
        run: bun run lint
      - name: Check blog i18n files
        run: bun run check:i18n
      - name: Run unit tests
        run: bun run test
      - name: Build project
        run: bun run build
  e2e:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
          cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps
      - name: Pull environment variables
        run: bunx vercel env pull --yes --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build project
        run: bun run build
      - name: Run Playwright tests
        run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
