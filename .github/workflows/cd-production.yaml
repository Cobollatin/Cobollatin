name: Vercel Preview Deployment
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  push:
    branches:
      - develop
jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest
    env:
      commit_message: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build -prod --yes --token=${{ secrets.VERCEL_TOKEN }}
      - name: Sanitize commit message
        run: |
          commit_message=$(echo "${{ github.event.head_commit.message }}" | sed ':a;N;$!ba;s/\n/ /g' | sed 's/"/\\"/g' | tr -s ' ')
          echo "COMMIT_MESSAGE=$commit_message" >> $GITHUB_ENV
      - name: Deploy Project Artifacts to Vercel
        id: vercel_deploy
        run: |
          DEPLOY_URL=$(vercel deploy \
          -m githubDeployment="1" \
          -m githubCommitRef="${{ github.ref_name }}" \
          -m githubCommitAuthorName="${{ github.event.head_commit.author.name }}" \
          -m githubCommitMessage="${{ env.COMMIT_MESSAGE }}" \
          -m githubCommitOrg="${{ github.repository_owner }}" \
          -m githubCommitRepo="${{ github.event.repository.name }}" \
          -m githubCommitSha="${{ github.sha }}" \
          -m githubOrg="${{ github.repository_owner }}" \
          -m githubRepo="${{ github.event.repository.name }}" \
          -m githubCommitAuthorLogin="${{ github.event.head_commit.author.username }}" \
          --prebuilt -prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "DEPLOYMENT_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "deployment_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
      - name: Get Deployment ID
        id: get_id
        run: |
          DEPLOYMENT_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" "https://api.vercel.com/v6/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID }}&target=production" | jq -r '.deployments | sort_by(.createdAt) | reverse | .[0].uid')
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
      - name: Delete Previous Deployments
        run: |
          DEPLOYMENTS=$(curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" "https://api.vercel.com/v6/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID }}&target=production")
          CURRENT_ID=${{ steps.get_id.outputs.deployment_id }}
          echo "$DEPLOYMENTS" | jq -r '.deployments[].uid' | grep -v "$CURRENT_ID" | while read -r ID; do
            echo "Deleting deployment $ID"
            curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" "https://api.vercel.com/v13/deployments/$ID"
          done
