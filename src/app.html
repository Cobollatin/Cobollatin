<!doctype html>
<html lang="%paraglide.lang%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <title>Cobollatin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
    <style>
      .main-container {
        display: contents;
      }
    </style>
    <script lang="ts">
      const __carbon_theme = localStorage.getItem('__carbon-theme') || 'white';
      if (__carbon_theme) {
        document.documentElement.setAttribute('theme', __carbon_theme);
      }
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div class="main-container">%sveltekit.body%</div>
  </body>
</html>
